name: Refresh portal data JSON
on:
  schedule:
    - cron: "26 */2 * * *"
    # Epic usually swaps its free games on Thursday at 15:00 UTC (18:00 MSK): refresh right after it,
    # so free-games/ does not show a finished giveaway until the next :26 run
    - cron: "7 15 * * 4"
  push:
    branches: [main]
    paths:
      # new fields / archive in data/freebies*.json appear right after the producer changes
      - scripts/update_freebies.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ping targets + Steam catalog snapshot
        run: python scripts/update_ping_baseline.py

      - name: Update Steam prices for the watchlist
        run: python scripts/update_prices.py || echo "::warning::prices update failed (last good data kept)"

      # Steam RU specials → data/deals.json (real prices only; writes on change or when the stamp is > 12 h old).
      # Discord deals posts are capped in scripts/discord_feeds.py (≤ 5 per run, ≤ 3 messages a day, deduped by game).
      - name: Steam deals (real discounts)
        run: python scripts/update_deals.py || echo "::warning::deals update failed (last good data kept)"

      - name: Price history (daily points, only changes)
        run: python scripts/update_price_history.py || echo "::warning::price history update failed (last good data kept)"

      - name: Update freebies (if script present)
        run: |
          if [ -f scripts/update_freebies.py ]; then
            python scripts/update_freebies.py || echo "update_freebies failed (non-fatal)"
          fi

      - name: Optional Steam profiles (needs STEAM_API_KEY secret)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_PROFILE_IDS: ${{ vars.STEAM_PROFILE_IDS }}
        run: |
          if [ -f scripts/update_steam_profiles.py ]; then
            python scripts/update_steam_profiles.py || echo "steam profiles skipped/failed"
          fi


      # free-games/ is built from data/freebies.json: rebuild the static pages right after the refresh
      # (the whole build is offline, takes < 1 s and only writes files whose content changed)
      - name: Static pages (free-games/ and the rest), sitemap
        run: python scripts/build_site_meta.py || echo "::warning::static pages / sitemap update failed"

      # Discord LFG snapshot / roles / events are box routines (bot token stays on the box):
      #   bash scripts/discord_box_sync.sh   (see scripts/discord_post.py)
      # Discord feed posting from Actions uses webhooks → discord-feeds.yml (dispatched below).
      - name: Commit data/*.json and generated pages if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          add_generated() {
            git add data/*.json 2>/dev/null || true
            git add sitemap.xml robots.txt index.html 2>/dev/null || true
            git add -A s/ 2>/dev/null || true
            # static SEO pages (scripts/build_static_pages.py); one path at a time so a missing one can't skip the rest
            for p in free-games guides games tools news; do if [ -e "$p" ]; then git add -A -- "$p" || true; fi; done
          }
          add_generated
          if git diff --cached --quiet; then
            echo "No data JSON / page changes"
            exit 0
          fi
          git commit -m "chore(data): refresh deals/ping/steam/prices/price history/freebies JSON, free-games page"
          for i in 1 2 3 4 5; do
            # generated files (sitemap, seo_pages.json, pages) may also have been rebuilt by daily-content:
            # on a conflict keep ours (-X theirs = the commit being replayed), then rebuild on top of the
            # merged tree so the result matches the latest data from both workflows
            if git pull --rebase --autostash -X theirs origin main; then
              python scripts/build_site_meta.py >/dev/null 2>&1 || true
              add_generated
              git diff --cached --quiet || git commit -m "chore(site): rebuild static pages after rebase"
              git push origin HEAD:main && break
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push attempt $i failed, retrying"; sleep $((i * 10))
          done
          gh workflow run pages.yml --ref main || echo "::warning::could not trigger pages deploy"

      - name: Post fresh freebies to Discord
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discord-feeds.yml --ref main || echo "::warning::could not trigger discord feed"
