name: Refresh portal data JSON
on:
  schedule:
    - cron: "26 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ping targets + Steam catalog snapshot
        run: python scripts/update_ping_baseline.py

      - name: Update Steam prices for the watchlist
        run: python scripts/update_prices.py || echo "::warning::prices update failed (last good data kept)"

      - name: Update freebies (if script present)
        run: |
          if [ -f scripts/update_freebies.py ]; then
            python scripts/update_freebies.py || echo "update_freebies failed (non-fatal)"
          fi

      - name: Optional Steam profiles (needs STEAM_API_KEY secret)
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_PROFILE_IDS: ${{ vars.STEAM_PROFILE_IDS }}
        run: |
          if [ -f scripts/update_steam_profiles.py ]; then
            python scripts/update_steam_profiles.py || echo "steam profiles skipped/failed"
          fi


      # Discord LFG snapshot / roles / events are box routines (bot token stays on the box):
      #   bash scripts/discord_box_sync.sh   (see scripts/discord_post.py)
      # Discord feed posting from Actions uses webhooks → discord-feeds.yml (dispatched below).
      - name: Commit data/*.json if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json || true
          if git diff --cached --quiet; then
            echo "No data JSON changes"
          else
            git commit -m "chore(data): refresh ping/steam/prices/freebies JSON"
            git pull --rebase origin main || true
            git push
            gh workflow run pages.yml --ref main || echo "::warning::could not trigger pages deploy"
          fi

      - name: Post fresh freebies to Discord
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discord-feeds.yml --ref main || echo "::warning::could not trigger discord feed"
